name: External links

# Weekly (and on demand) check that every link on the page still answers.
# Separate from "Checks" so a third-party site being down never blocks a PR.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # 403/429/999: LinkedIn, X and Coursera answer bots with those even when the link is fine.
          args: >-
            --no-progress --max-retries 2 --timeout 20
            --accept '200..=299,403,429,999'
            --exclude '^mailto:'
            --exclude '^https://portfolio\.lcaitech\.com'
            index.html
          fail: true
